{
  "task_id": "abstract_spin_3sat_seed58",
  "hardware_spec": "hardware_specs/abstract_spin.yaml",
  "frozen_layers": {
    "task_level": [
      "objective_metric",
      "problem",
      "forbidden_shortcuts",
      "stop_rules",
      "required_artifacts",
      "hamiltonian_structure.problem_fixed_terms",
      "hamiltonian_structure.hardware_fixed_terms"
    ]
  },
  "editable_search_layers": {
    "task_level": [
      "protocol family",
      "controllable Hamiltonian terms",
      "optional auxiliary terms",
      "time-dependent coefficient shapes",
      "schedule/path design",
      "total evolution time T",
      "heuristic search scripts under run_dir"
    ]
  },
  "reward_definition": {
    "primary_reward": "final_ground_state_fidelity",
    "degenerate_ground_space_reward": true
  },
  "search_preferences": {
    "prefer_translation_symmetric_pauli_controls": true,
    "translation_symmetry_only_if_compatible_with_task": true,
    "prefer_smooth_hamiltonian_path": true,
    "avoid_unnecessary_hard_restrictions": true,
    "simplification_metric_tolerance": 0.001,
    "metric_tie_tolerance": 1e-6,
    "ranking_tie_break_order": [
      "translation_symmetry_score",
      "smoothness_score",
      "simplicity_score"
    ]
  },
  "objective_metric": "final_ground_state_fidelity",
  "sim_budget": 500000,
  "allowed_protocol_families": [
    "interp",
    "sta",
    "aqc_d"
  ],
  "problem": {
    "kind": "3sat",
    "n_qubits": 6,
    "m_clauses": 18,
    "seed": 58
  },
  "hamiltonian_structure": {
    "problem_fixed_terms": [
      "H_P(3SAT instance seed=58)",
      "H_B(transverse-field driver)"
    ],
    "hardware_fixed_terms": [],
    "controllable_terms": [
      "(1-s(t)) * H_B + s(t) * H_P"
    ],
    "optional_auxiliary_terms": [
      "A_cd(t)"
    ],
    "forbidden_controllable_terms": [
      "changing SAT clauses during optimization",
      "changing H_P instance definition"
    ]
  },
  "path_design_space": {
    "editable": true,
    "description": "Design schedule path s(t) and optional auxiliary CD path under abstract-spin constraints."
  },
  "time_scale_design_space": {
    "editable": true,
    "allow_total_time_search": true,
    "allow_segmentation": false
  },
  "run_search_directive_defaults": {
    "allowed_parameterizations": {
      "schedule": ["linear", "fourier", "piecewise", "spline"],
      "cd_strength": ["constant", "linear", "fourier", "piecewise", "spline"]
    },
    "allowed_cd_kinds": ["none", "analytical", "parameterized"],
    "allowed_cd_orders": ["unspecified", "first_order", "second_order"]
  },
  "baseline_candidate": {
    "candidate_id": "baseline_linear_T40",
    "family": "interp",
    "hardware": "abstract_spin",
    "total_time": 40.0,
    "channels": [
      {"name": "schedule", "basis": "linear", "params": {}}
    ],
    "cd": {"kind": "none", "ansatz": null, "order": null, "params": {}},
    "constraints": {},
    "provenance": {"source": "task_spec_baseline"},
    "notes": ["phase-1 abstract-spin baseline"]
  },
  "forbidden_shortcuts": [
    "hidden_optimal_protocol",
    "evaluator_modification",
    "target_state_leakage"
  ],
  "stop_rules": [
    {"rule": "budget_exhausted"},
    {
      "rule": "min_distinct_strategies_attempted",
      "count": 10,
      "mode_scope": "full",
      "require_constraint_ok": true
    },
    {"rule": "target_metric_reached", "metric": "final_ground_state_fidelity", "threshold": 0.99}
  ],
  "continue_rules": [
    {
      "if_metric_below": 0.99,
      "actions": [
        "continue_exploration",
        "try_alternative_protocol_family",
        "increase_total_time",
        "consider_cd_or_sta"
      ]
    }
  ],
  "required_artifacts": [
    "protocol.py",
    "heuristic_search.py",
    "best_protocol.json",
    "trials.jsonl",
    "summary.csv",
    "sample_efficiency.png",
