    "hamiltonian_form.md",
    "trajectory_diagnostics.npz",
    "failure_notes.md",
    "README.md"
  ],
  "protected_paths": [
    "src/qoc_lbi/evaluator.py",
    "src/qoc_lbi/budget.py",
    "src/qoc_lbi/constraints.py",
